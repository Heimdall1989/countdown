<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Countdown to my amazing wife's arrival, and the kids!</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #000;
      color: #f9fafb;
      text-align: center;
      padding-top: 60px;
      position: relative;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* STARFIELD BACKGROUND */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: black;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      opacity: 0.8;
      border-radius: 50%;
      animation: drift 12s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0px); }
      to { transform: translateY(800px); }
    }

    /* GLOWING BORDER AROUND MAIN CONTENT */
    #glowBox {
      width: 80%;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      border-radius: 20px;
      background: rgba(10, 15, 36, 0.6);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25),
                  0 0 50px rgba(255, 255, 255, 0.15),
                  0 0 80px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
    }

    h1 { margin-bottom: 0.2rem; }
    h2 { margin-top: 0.2rem; color: #e5e7eb; font-weight: 400; }

    #countdown {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 20px 0 30px;
    }

    /* Progress bars */
    .bar-container {
      width: 70%;
      max-width: 600px;
      height: 18px;
      background: #111827;
      border-radius: 999px;
      margin: 0 auto 10px;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #f97316, #22c55e);
      transition: width 0.3s linear;
    }
    .label {
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #d1d5db;
    }

    /* Heartbeat */
    .pulse-wrapper {
      margin-top: 20px;
    }
    .pulse {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto;
      background: radial-gradient(circle at 30% 30%, #f9a8d4, #db2777);
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
      animation: heartbeat 1s infinite;
    }
    @keyframes heartbeat {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.12); }
      40%  { transform: scale(1); }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* Floating love message */
    #floatingLove {
      position: fixed;
      top: 20%;
      left: -50%;
      font-size: 1.4rem;
      color: #f9fafb;
      opacity: 0.85;
      white-space: nowrap;
      animation: floatAcross 18s linear infinite;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
      pointer-events: none;
      z-index: 10;
    }

    @keyframes floatAcross {
      0%   { left: -50%; }
      50%  { left: 110%; }
      100% { left: -50%; }
    }
  </style>
</head>
<body>

  <!-- STARFIELD -->
  <div id="starfield"></div>

  <!-- FLOATING LOVE MESSAGE -->
  <div id="floatingLove">no matter where I am, remember I love you!</div>

  <!-- MAIN CONTENT WITH GLOW -->
  <div id="glowBox">
    <h1>Countdown to my amazing wife's arrival, and the kids! ❤️</h1>
    <h2>May 22, 2026 – 11:00 PM (EDT)</h2>

    <div id="countdown"></div>

    <!-- Days survived counter -->
    <div id="daysSurvived" style="font-size: 1.4rem; margin-top: 20px; color: #f3f4f6;"></div>

    <!-- Progress bar 1 -->
    <div class="bar-container">
      <div class="bar-fill" id="bar1"></div>
    </div>
    <div class="label" id="label1"></div>

    <!-- Progress bar 2 -->
    <div class="bar-container">
      <div class="bar-fill" id="bar2"></div>
    </div>
    <div class="label" id="label2"></div>

    <!-- Heartbeat -->
    <div class="pulse-wrapper">
      <div class="pulse"></div>
      <div class="label">Every beat is one second closer</div>
    </div>
  </div>

  <script>
    /* STARFIELD GENERATION */
    const starfield = document.getElementById("starfield");
    for (let i = 0; i < 120; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * -100 + "%";
      star.style.animationDuration = 8 + Math.random() * 10 + "s";
      star.style.opacity = 0.3 + Math.random() * 0.7;
      starfield.appendChild(star);
    }

    /* COUNTDOWN LOGIC */
    const target = new Date("May 22, 2026 23:00:00 EDT").getTime();

    // Progress bar #1 start date (when you left Florida)
    const start1 = new Date("May 2, 2026 12:00:00 EDT").getTime();

    // Progress bar #2 start date (total trip)
    const start2 = new Date("May 2, 2026 12:00:00 EDT").getTime();

    // NEW END DATE FOR BAR #2
    const end2 = new Date("May 30, 2026 13:00:00 EDT").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = target - now;

      const countdownEl = document.getElementById("countdown");
      const bar1 = document.getElementById("bar1");
      const bar2 = document.getElementById("bar2");
      const label1 = document.getElementById("label1");
      const label2 = document.getElementById("label2");
      const daysSurvivedEl = document.getElementById("daysSurvived");

      if (diff <= 0) {
        countdownEl.innerHTML = "THEY'RE HERE ❤️";
        bar1.style.width = "100%";
        bar2.style.width = "100%";
        label1.textContent = "100% of the wait since you left....";
        label2.textContent = "100% of the total trip completed.";
        daysSurvivedEl.textContent = "";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.innerHTML =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s";

      const survivedMs = now - start1;
      const survivedDays = Math.floor(survivedMs / (1000 * 60 * 60 * 24));
      daysSurvivedEl.textContent = survivedDays + " days survived since leaving....";

      // Progress bar #1
      const total1 = target - start1;
      const elapsed1 = now - start1;
      const percent1 = Math.min(Math.max((elapsed1 / total1) * 100, 0), 100);
      bar1.style.width = percent1.toFixed(2) + "%";
      label1.textContent = percent1.toFixed(2) + "% of the wait since you left....";

      // Progress bar #2 (corrected end date)
      const total2 = end2 - start2;
      const elapsed2 = now - start2;
      const percent2 = Math.min(Math.max((elapsed2 / total2) * 100, 0), 100);
      bar2.style.width = percent2.toFixed(2) + "%";
      label2.textContent = percent2.toFixed(2) + "% of the total trip completed.";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
